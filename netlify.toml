[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  targetPort = 5173

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The "Deploy to Netlify" button asks for these.
[template.environment]
  ADMIN_PASSWORD = "Password for /admin. You'll also type it once on each tablet."
